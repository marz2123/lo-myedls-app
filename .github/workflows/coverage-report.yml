name: Coverage Report

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Run weekly on Monday at 00:00 UTC
    - cron: '0 0 * * 1'

jobs:
  coverage:
    name: Generate Coverage Report
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      - name: Run tests with coverage
        run: |
          deno test --allow-net --allow-env --coverage=coverage supabase/functions/**/*.test.ts

      - name: Generate LCOV report
        run: |
          deno coverage coverage --lcov --output=coverage.lcov

      - name: Generate coverage summary
        run: |
          deno run --allow-read --allow-write scripts/coverage-summary.ts coverage.lcov

      - name: Generate coverage badge
        run: |
          deno run --allow-read --allow-write scripts/generate-coverage-badge.ts coverage.lcov

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.lcov
          flags: edge-functions
          name: codecov-upload
          fail_ci_if_error: false
          verbose: true

      - name: Upload coverage summary as artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage-summary.md
            coverage-badge.svg
            coverage.lcov
          retention-days: 30

      - name: Comment PR with coverage
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const coverage = fs.readFileSync('coverage-summary.md', 'utf8');
            
            // Find existing coverage comment
            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            
            const botComment = comments.find(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes('📊 Code Coverage Report')
            );
            
            // Update or create comment
            if (botComment) {
              await github.rest.issues.updateComment({
                comment_id: botComment.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: coverage
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: coverage
              });
            }

      - name: Check coverage threshold
        run: |
          deno run --allow-read scripts/check-coverage-threshold.ts coverage.lcov 80

      - name: Coverage trends
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "📈 Coverage trends will be tracked in Codecov dashboard"
          echo "Visit: https://codecov.io/${{ github.repository }}"
